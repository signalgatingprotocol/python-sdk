name: SDK improvement

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Concrete outcome. Leave empty to remove repeated maintenance work."
        type: string
        required: false
  schedule:
    - cron: "23 14 * * 1"
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: sdk-improvement
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (vars.SDK_IMPROVEMENT_ENABLED == 'true' &&
        (github.event_name == 'schedule' ||
         (github.event.workflow_run.conclusion == 'failure' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.id == github.repository_id))))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      proceed: ${{ steps.authorize.outputs.proceed }}
      sha: ${{ steps.authorize.outputs.sha }}
    steps:
      - name: Require maintainers and skip duplicate work
        id: authorize
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const actors = new Set([
              context.actor,
              process.env.GITHUB_TRIGGERING_ACTOR,
              context.payload.workflow_run?.actor?.login,
            ].filter(Boolean));
            for (const username of actors) {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                ...context.repo, username,
              });
              if (!['admin', 'maintain'].includes(data.role_name)) {
                throw new Error(`${username} must have maintain or admin access`);
              }
            }
            const pulls = await github.paginate(github.rest.pulls.list, {
              ...context.repo, state: 'open', per_page: 100,
            });
            const pending = pulls.some(pr =>
              pr.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}` &&
              pr.head.ref.startsWith('maintenance/improve-'));
            core.setOutput('proceed', String(!pending));
            const { data } = await github.rest.repos.getCommit({
              ...context.repo, ref: 'main',
            });
            core.setOutput('sha', data.sha);
            if (pending) core.notice('An improvement PR is already open. Skipping inference.');

  propose:
    needs: prepare
    if: needs.prepare.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    environment: sdk-improvement
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Check inference configuration
        env:
          INFERENCE_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$INFERENCE_KEY" ]; then
            echo "::error::Add OPENAI_API_KEY to the sdk-improvement environment before running."
            exit 1
          fi
      - name: Install SDK validation tools
        run: python -m pip install -e ".[dev]" build twine
      - name: Collect bounded task evidence
        env:
          GH_TOKEN: ${{ github.token }}
          TASK: ${{ inputs.task }}
          FAILED_RUN: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p /tmp/proposal
          python - <<'PY'
          import os
          from pathlib import Path
          Path('maintenance-task.txt').write_text(os.environ.get('TASK', ''), encoding='utf-8')
          PY
          gh pr list --state all --limit 15 --json number,title,state,headRefName > maintenance-history.json
          gh issue list --state open --limit 15 --json number,title,body > maintenance-issues.json
          if [ -n "$FAILED_RUN" ]; then
            gh run view "$FAILED_RUN" --log-failed > /tmp/failed-ci.log
            head -c 60000 /tmp/failed-ci.log > maintenance-failure.txt
          fi
      - name: Propose one improvement
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        timeout-minutes: 18
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/skills/sdk-maintenance/SKILL.md
          output-file: /tmp/proposal/summary.md
          sandbox: workspace-write
          safety-strategy: drop-sudo
          codex-args: '["--ephemeral"]'
          model: ${{ vars.SDK_IMPROVEMENT_MODEL || 'gpt-6.1-sol' }}
      - name: Export the proposal
        run: |
          rm -f maintenance-task.txt maintenance-history.json maintenance-issues.json maintenance-failure.txt
          git add --all
          git diff --cached --binary HEAD > /tmp/proposal/change.patch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proposal
          path: /tmp/proposal/
          if-no-files-found: error
          retention-days: 7

  validate:
    needs: [prepare, propose]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: proposal
          path: /tmp/proposal
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Enforce patch scope in a fresh checkout
        id: patch
        run: |
          python scripts/validate_improvement.py /tmp/proposal/change.patch
          if [ -s /tmp/proposal/change.patch ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify lint, types, tests, package, and installed demo
        if: steps.patch.outputs.changed == 'true'
        run: |
          python -m pip install -e ".[dev]" build twine
          make check smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.patch.outputs.changed == 'true'
        with:
          name: verified-proposal
          path: /tmp/proposal/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, validate]
    if: needs.validate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-proposal
          path: /tmp/verified-proposal
      - run: git apply --index /tmp/verified-proposal/change.patch
      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        id: pr
        with:
          branch: maintenance/improve-${{ github.run_id }}
          base: main
          draft: true
          title: "[maintenance] Reduce repeated SDK work"
          commit-message: "fix: reduce repeated SDK maintenance"
          body-path: /tmp/verified-proposal/summary.md
      - name: Run CI on the proposed branch
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: maintenance/improve-${{ github.run_id }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          gh workflow run ci.yml --ref "$BRANCH"
          echo "Draft PR: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
